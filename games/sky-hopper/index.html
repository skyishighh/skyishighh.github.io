<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Hopper Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mukta:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: arcade game UI over a moving sky. Everything is a chunky sticker:
   thick navy outline, hard drop shadow, bright fill. Gold = coins, green = buy, purple = ad. */
:root {
  color-scheme: dark;
  --line: #10182e;
  --night: #0c1630;
  --panel: #23408a;
  --panel-hi: #3157b3;
  --panel-lo: #1a2f69;
  --ink: #fff8ea;
  --muted: #c3d0f2;
  --gold: #ffc530;
  --go: #5fe08a;
  --ad: #a47bff;
  --fuel: #ff5a4f;
  --display: "Baloo 2", "Trebuchet MS", "Segoe UI", sans-serif;
  --body: "Mukta", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.3;
       overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button:disabled { cursor: default; }
.num { font-variant-numeric: tabular-nums; }
.stroke { -webkit-text-stroke: 6px var(--line); paint-order: stroke fill; }

#game { position: relative; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; background: var(--night);
        user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; } /* only the canvas blocks scrolling, so the hangar list can scroll */
.coin { width: 22px; height: 22px; border-radius: 50%; background: var(--gold); border: 2.5px solid var(--line);
        box-shadow: inset -2px -2px 0 rgba(0,0,0,.18), inset 2px 2px 0 rgba(255,255,255,.5); flex: none; display: inline-block; }
.coin.sm { width: 16px; height: 16px; border-width: 2px; }

/* ---------- Sticker button ---------- */
.btn { font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1; text-transform: uppercase; letter-spacing: .02em;
       color: var(--line); background: var(--ink); border: 3px solid var(--line); border-radius: 14px; box-shadow: 0 4px 0 var(--line);
       padding: 10px 12px 7px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
.btn:not(:disabled):active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn.buy { background: var(--go); }
.btn.gold { background: var(--gold); }
.btn.ad { background: var(--ad); color: var(--ink); text-shadow: 0 2px 0 rgba(16,24,46,.55); }
.btn:disabled { background: var(--panel-lo); color: #7f92c4; box-shadow: 0 4px 0 var(--line); }
.btn:disabled .coin { filter: grayscale(.7); opacity: .7; }
.adi { flex: none; }

/* ---------- Flight HUD ---------- */
#hud { position: absolute; left: 0; right: 0; top: 0; padding: 12px 14px 0; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
#hud[hidden] { display: none; }
.track { position: relative; height: 14px; border-radius: 8px; background: rgba(16,24,46,.55); border: 3px solid var(--line); margin: 6px 18px 4px 8px; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--go); width: 0; }
.track b { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--fuel); border: 3px solid var(--line); box-shadow: inset 0 0 0 3px var(--ink); left: 0; }
.track .isl { position: absolute; right: -20px; top: 50%; width: 30px; height: 17px; margin-top: -11px; border-radius: 16px 16px 4px 4px; background: var(--gold); border: 3px solid var(--line); }
.hudrow { display: flex; align-items: center; gap: 10px; }
.fuel { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--panel-lo); border: 3px solid var(--line); border-radius: 14px; padding: 5px 7px 5px 10px; box-shadow: 0 3px 0 var(--line); }
.fuel label { font-family: var(--display); font-weight: 800; font-size: 15px; line-height: 1; padding-top: 3px; letter-spacing: .06em; }
.fuelbar { flex: 1; height: 16px; border-radius: 7px; background: rgba(16,24,46,.6); border: 2px solid var(--line); overflow: hidden; }
.fuelbar i { display: block; height: 100%; width: 100%; background: var(--go); box-shadow: inset 0 3px 0 rgba(255,255,255,.35); }
.fuel.low .fuelbar i { background: var(--fuel); }
.fuel.low { animation: pulse .45s infinite alternate; }
@keyframes pulse { to { background: #a02a35; transform: scale(1.03); } }
.purse { display: flex; align-items: center; gap: 6px; background: var(--panel-lo); border: 3px solid var(--line); border-radius: 14px; box-shadow: 0 3px 0 var(--line);
         padding: 4px 12px 0 6px; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.25; }
.hudrow2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#dist { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; -webkit-text-stroke: 5px var(--line); paint-order: stroke fill; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.chip { background: var(--line); border-radius: 9px; padding: 2px 8px 0; font-family: var(--display); font-size: 15px; font-weight: 800; }

/* ---------- Menu: logo and coin plaque over the sky ---------- */
#menuTop { position: absolute; left: 14px; right: 14px; top: 12px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
#menuTop[hidden] { display: none; }
.logo { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: .8; text-transform: uppercase; color: var(--gold);
        -webkit-text-stroke: 9px var(--line); paint-order: stroke fill; text-shadow: 0 6px 0 var(--line); transform: rotate(-5deg); padding: 10px 0 0 4px; }
.logo span { color: var(--ink); display: block; }
.wallet { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1;
          background: var(--panel-lo); border: 3px solid var(--line); border-radius: 16px; box-shadow: 0 4px 0 var(--line); padding: 8px 14px 4px 8px; }
.wallet .coin { width: 26px; height: 26px; margin-top: -4px; }
.tr { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.snd { pointer-events: auto; width: 46px; height: 46px; display: grid; place-items: center; background: var(--ink); border: 3px solid var(--line); border-radius: 14px; box-shadow: 0 4px 0 var(--line); padding: 0; }
.snd:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

/* ---------- Hangar panel ---------- */
#sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 66%; background: var(--panel); border-top: 4px solid var(--line);
         border-radius: 28px 28px 0 0; box-shadow: inset 0 5px 0 rgba(255,255,255,.16); padding: 14px 12px 14px; display: flex; flex-direction: column; gap: 9px; }
#sheet[hidden] { display: none; }
#sheet > * { flex: none; }
#sheet > .scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -4px; padding: 2px 4px 6px; }
.leg { background: var(--panel-lo); border: 3px solid var(--line); border-radius: 16px; padding: 8px 10px; }
.legt { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1; text-transform: uppercase; }
.legt em { margin-left: auto; font-style: normal; font-family: var(--body); font-weight: 700; font-size: 13px; text-transform: none; color: var(--gold); }
.legbar { position: relative; height: 22px; border-radius: 9px; background: rgba(16,24,46,.6); border: 2px solid var(--line); margin-top: 6px; overflow: hidden; }
.legbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); box-shadow: inset 0 4px 0 rgba(255,255,255,.4); }
.legbar span { position: relative; display: block; text-align: center; font-weight: 700; font-size: 13px; line-height: 19px; text-shadow: 0 1px 0 var(--line), 0 -1px 0 var(--line), 1px 0 0 var(--line), -1px 0 0 var(--line); }
.atlas { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.sky { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #8ea2d6; border: 2px dashed #5b74b8; border-radius: 999px; padding: 2px 10px 2px 3px; }
.sky.on { color: var(--ink); border: 2px solid var(--line); background: var(--panel-lo); }
.sky i { width: 18px; height: 18px; border-radius: 50%; background: rgba(16,24,46,.4); border: 2px solid var(--line); }
.tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.tab { font-family: var(--display); font-weight: 800; font-size: 16px; line-height: 1; text-transform: uppercase; color: var(--muted);
       background: var(--panel-lo); border: 3px solid var(--line); border-radius: 14px 14px 6px 6px; padding: 9px 8px 5px; }
.tab.on { background: var(--ink); color: var(--line); box-shadow: 0 4px 0 var(--line); transform: translateY(-2px); }
.upgs { display: flex; flex-direction: column; gap: 9px; }
.tab .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--fuel); border: 2px solid var(--line); margin-left: 5px; vertical-align: 1px; }
.pl { display: flex; flex-direction: column; gap: 8px; background: var(--panel-hi); border: 3px solid var(--line); border-radius: 16px; padding: 10px;
      box-shadow: 0 4px 0 var(--line), inset 0 3px 0 rgba(255,255,255,.18); cursor: pointer; }
.pl.locked { background: var(--panel-lo); }
.pl.sel { box-shadow: 0 4px 0 var(--line), inset 0 0 0 3px var(--gold); }
.pl.look { box-shadow: 0 4px 0 var(--line), inset 0 0 0 3px var(--ink); }
.plhead { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: center; }
.pl .n { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1; display: flex; align-items: center; gap: 6px; }
.pl .e { font-size: 13px; line-height: 1.25; color: var(--muted); margin-top: 3px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 700; color: var(--line); border: 2px solid var(--line); border-radius: 8px; padding: 2px 7px 0; }
.tag.up { background: var(--go); } .tag.down { background: #ff9a8f; }
.spec { display: grid; grid-template-columns: 1fr 104px; gap: 10px; align-items: center; background: rgba(16,24,46,.35); border-radius: 12px; padding: 8px; }
.spec b { font-family: var(--display); font-weight: 800; font-size: 16px; line-height: 1; display: flex; align-items: center; gap: 6px; }
.spec span { display: block; font-size: 13px; line-height: 1.2; color: var(--muted); margin-top: 3px; }
.spec .btn, .plbuy .btn { font-size: 15px; padding: 8px 6px 5px; min-height: 42px; }
.plbuy { display: grid; grid-template-columns: 1fr 1.25fr; gap: 8px; }
.free { font-size: 12px; font-weight: 700; color: var(--gold); text-align: center; }
.upg { display: grid; grid-template-columns: 48px 1fr 104px; gap: 10px; align-items: center; background: var(--panel-hi); border: 3px solid var(--line);
       border-radius: 16px; box-shadow: 0 4px 0 var(--line), inset 0 3px 0 rgba(255,255,255,.18); padding: 8px 8px 8px 8px; }
.ico { width: 48px; height: 48px; border-radius: 13px; background: var(--c); border: 3px solid var(--line); display: grid; place-items: center;
       box-shadow: inset 0 4px 0 rgba(255,255,255,.4), inset 0 -4px 0 rgba(0,0,0,.15); }
.upg .n { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lv { font-style: normal; font-size: 12px; background: var(--line); color: var(--gold); border-radius: 6px; padding: 3px 6px 1px; letter-spacing: .04em; }
.upg .e { font-size: 13px; line-height: 1.2; color: var(--muted); margin-top: 2px; }
.upg .e em { display: block; font-style: normal; font-weight: 700; color: var(--gold); }
.upg .btn { font-size: 16px; padding: 8px 6px 5px; min-height: 42px; }
.upg .btn.ad { font-size: 13px; }
.fly { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; text-transform: uppercase; letter-spacing: .03em; color: var(--line);
       background: var(--gold); border: 4px solid var(--line); border-radius: 20px; box-shadow: 0 6px 0 var(--line), inset 0 5px 0 rgba(255,255,255,.5);
       padding: 14px 16px 8px; width: 100%; margin-bottom: 6px; animation: breathe 1.1s ease-in-out infinite alternate; }
.fly:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); animation: none; }
@keyframes breathe { to { transform: scale(1.03); } }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: #9fb1e0; padding: 10px 2px 0; }
.foot button { background: none; color: #9fb1e0; text-decoration: underline; font-size: 12px; padding: 6px 0; }

/* ---------- Pop-up cards ---------- */
#overlay:empty { display: none; }
#overlay { position: absolute; inset: 0; background: rgba(8, 14, 34, .66); display: grid; place-items: center; padding: 16px; z-index: 5; }
.card { position: relative; width: 100%; max-width: 400px; background: var(--panel); border: 4px solid var(--line); border-radius: 24px;
        box-shadow: 0 8px 0 var(--line), inset 0 5px 0 rgba(255,255,255,.16); padding: 40px 14px 16px; display: flex; flex-direction: column; gap: 11px; text-align: center; }
.card.pop { animation: popin .28s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes popin { from { transform: scale(.7); opacity: 0; } }
.ribbon { position: absolute; left: 50%; top: -24px; transform: translateX(-50%) rotate(-2deg); white-space: nowrap; font-family: var(--display); font-weight: 800;
          font-size: 28px; line-height: 1; text-transform: uppercase; color: var(--line); background: var(--gold); border: 4px solid var(--line);
          border-radius: 14px; box-shadow: 0 5px 0 var(--line); padding: 12px 18px 6px; }
.ribbon.good { background: var(--go); }
.ribbon.bad { background: var(--fuel); color: var(--ink); }
.ribbon.warn { background: #ff9a3c; }
.card p { margin: 0; color: var(--muted); font-size: 15px; font-weight: 600; }
.big { font-family: var(--display); font-weight: 800; font-size: 60px; line-height: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
       color: var(--gold); -webkit-text-stroke: 8px var(--line); paint-order: stroke fill; padding-top: 6px; }
.big .coin { width: 42px; height: 42px; border-width: 4px; margin-top: -8px; }
.sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sum div { background: var(--panel-lo); border: 3px solid var(--line); border-radius: 14px; padding: 8px 4px 5px; }
.sum b { font-family: var(--display); font-weight: 800; font-size: 22px; display: block; line-height: 1; }
.sum span { font-size: 12px; font-weight: 600; color: var(--muted); }
.card .btn { min-height: 52px; font-size: 18px; }
.perks { display: flex; flex-direction: column; gap: 10px; }
.perk { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--panel-hi); border: 3px solid var(--line); border-radius: 16px;
        box-shadow: 0 4px 0 var(--line), inset 0 3px 0 rgba(255,255,255,.18); padding: 9px 10px 7px; width: 100%; animation: popin .3s cubic-bezier(.3, 1.5, .5, 1) backwards; }
.perk:nth-child(2) { animation-delay: .07s; } .perk:nth-child(3) { animation-delay: .14s; }
.perk:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.perk .g { width: 50px; height: 50px; border-radius: 14px; background: var(--pc); color: var(--line); border: 3px solid var(--line); display: grid; place-items: center;
           font-family: var(--display); font-weight: 800; font-size: 26px; flex: none; box-shadow: inset 0 4px 0 rgba(255,255,255,.4); }
.perk b { display: block; font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.05; }
.perk b small { color: var(--gold); font-size: 13px; margin-left: 6px; }
.perk span { font-size: 14px; line-height: 1.2; color: var(--muted); }
.perk .rar { display: inline-block; font-style: normal; font-family: var(--display); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
             background: var(--line); color: var(--muted); border-radius: 6px; padding: 3px 6px 1px; margin-bottom: 3px; }
.perk.rare { background: #2d6fc4; } .perk.rare .rar { color: #7fd6ff; }
.perk.epic { background: linear-gradient(110deg, #b8791a 0%, #e0a52a 45%, #ffe08a 50%, #e0a52a 55%, #b8791a 100%); background-size: 300% 100%; animation: popin .3s cubic-bezier(.3, 1.5, .5, 1) backwards, shine 2.2s linear infinite; }
.perk.epic .rar { color: var(--gold); } .perk.epic span { color: var(--ink); }
@keyframes shine { from { background-position: 100% 0; } to { background-position: 0 0; } }
.adbox { border: 3px dashed #5b74b8; border-radius: 14px; padding: 22px 12px; }
.adbox b { font-family: var(--display); font-size: 64px; font-weight: 800; display: block; line-height: 1; }
@media (max-height: 640px) { #sheet { height: 72%; } .logo { font-size: 36px; } }
@media (prefers-reduced-motion: reduce) { .fuel.low, .fly, .card.pop, .perk, .perk.epic { animation: none; } }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="track"><i id="trackFill"></i><b id="trackPlane"></b><span class="isl"></span></div>
    <div class="hudrow">
      <div class="fuel" id="fuelBox"><label>FUEL</label><div class="fuelbar"><i id="fuelFill"></i></div></div>
      <div class="purse num"><i class="coin"></i><span id="runCoins">0</span></div>
    </div>
    <div class="hudrow2"><div id="dist" class="num">0 m</div><div class="chips" id="perkChips"></div></div>
  </div>
  <div id="menuTop"></div>
  <div id="sheet"></div>
  <div id="overlay"></div>
</div>

<script>
(function () {
  'use strict';

  /* ================= Tuning (change the feel and economy here) ================= */

  var PX_PER_M = 10;              // screen pixels per metre flown
  var GRAVITY = 900, LIFT = 1250; // px/s²
  var VY_UP = -380, VY_DOWN = 480;
  var HOLD_BURN = 1.15, DIVE_BURN = 0.8;   // fuel used per second: climbing costs more than diving
  var DIVE_SPEED_BONUS = 0.25;
  var CRUISE_CAP = 42;            // metres per second: the Engine never cruises faster than this
  var SPEED_CEILING = 52;         // hard limit with every boost stacked, so obstacles stay readable
  var ENGINE_SPEED_LEVELS = 6;    // Engine levels after this improve climbing instead of speed
  var HIT_SHARE = { storm: 0.25, bird: 0.12, balloon: 0.12, tower: 0.2, berg: 0.2, zap: 0.25, bomb: 0.2, gate: 0.2 }; // share of the tank lost per hit
  var ZAP_WARN = 0.85;            // seconds of warning before lightning strikes
  var BOMB_G = 1400, WIND_PUSH = 420;
  var MAX_LANE_STEP_PX = 105;     // the safe path never moves more than this between two patterns
  var LINE = '#10182e';

  /* What flies at you on each island. The first type is the new one and appears most often. */
  var ISLAND_HAZARDS = [
    { types: ['storm'],                    dark: false, intro: null },
    { types: ['balloon', 'bird', 'storm'], dark: false, intro: ['New: balloons', 'Steer around them'] },
    { types: ['tower', 'storm', 'bird'],   dark: false, intro: ['New: rock towers', 'Fly over them'] },
    { types: ['zap', 'storm', 'bird'],     dark: false, intro: ['New: lightning', 'When the line flashes, change height'] },
    { types: ['bomb', 'tower', 'storm'],   dark: false, intro: ['New: lava bombs', 'Stay above where they pop'] },
    { types: ['storm', 'bird'],            dark: true,  intro: ['New: darkness', 'Obstacles show up late'] },
    { types: ['berg', 'wind', 'storm'],    dark: false, intro: ['New: icebergs and wind', 'Fight the push'] },
    { types: ['gate', 'bird', 'storm'],    dark: false, intro: ['New: tower gaps', 'Fly through the gap'] }
  ];
  var ALL_HAZARDS = ['balloon', 'tower', 'zap', 'bomb', 'berg', 'wind', 'gate', 'bird'];
  var FUEL_CAN_SHARE = 0.35;
  var AD_SECONDS = 3;
  var AD_MIN_SHARE = 0.5;         // an ad can cover the gap once you hold half the price
  var SAVE_KEY = 'sky-hopper-prototype-v1';

  /* One environment per hop. scene = background set piece, island = landing island style. */
  var THEMES = [
    { name: 'Morning Bay',    top: '#3aa7f5', bot: '#c8ecff', sea: '#1877c9', sun: '#fff3b0', far: '#6fb9e8', stars: false, scene: 'none',     island: 'sand' },
    { name: 'Sunset Strait',  top: '#f2683f', bot: '#ffd58f', sea: '#a8456f', sun: '#fff0c2', far: '#d9785f', stars: false, scene: 'boats',    island: 'sand' },
    { name: 'Dusk Reef',      top: '#4b3aa0', bot: '#f191b4', sea: '#2c2d7c', sun: '#ffd9e6', far: '#7a5bb5', stars: false, scene: 'stacks',   island: 'rock' },
    { name: 'Storm Pass',     top: '#31485a', bot: '#a5bcc7', sea: '#1c4756', sun: '#e8f1f4', far: '#58727f', stars: false, scene: 'rain',     island: 'rock' },
    { name: 'Volcano Chain',  top: '#2a0f14', bot: '#e2562b', sea: '#3a1420', sun: '#ffcf7a', far: '#541a1a', stars: false, scene: 'volcano',  island: 'lava' },
    { name: 'Midnight Sea',   top: '#070d2b', bot: '#2a3f8f', sea: '#0a1a4a', sun: '#f4f1d8', far: '#1b2a66', stars: true,  scene: 'night',    island: 'sand' },
    { name: 'Aurora Deep',    top: '#04202f', bot: '#1fa58b', sea: '#052f44', sun: '#d9fff4', far: '#0f5c63', stars: true,  scene: 'aurora',   island: 'ice'  },
    { name: 'Neon Harbour',   top: '#120a3a', bot: '#c2338f', sea: '#1a0f4a', sun: '#ffd1f0', far: '#2a1766', stars: true,  scene: 'city',     island: 'city' }

    if (type === 'wind') {
      side = lane < 0.5 ? 1 : -1;                                      // blow toward the roomier side
      e = addEnt('wind', x0 + len * 0.1, 0); e.w = len * 0.85; e.dir = side;
      y = laneY + side * (50 + 22 + margin + 40);
      if (y >= top && y <= bot) addEnt('storm', x, y);                 // a storm waits downwind
      return 0;
    }
    if (type === 'tower' || type === 'berg' || type === 'bomb') {      // these come up from the sea, so they sit below the lane
      y = laneY + 22 + margin + (type === 'bomb' ? 30 : 10) + Math.random() * 40;
      if (y <= bot + 30 && forceSide <= 0) {
        e = addEnt(type, x, y);
        if (type === 'bomb') { e.peakY = y; e.y = SEA_Y + 20; e.t = 0; e.launched = false; e.v0 = Math.sqrt(2 * BOMB_G * (SEA_Y + 20 - y)); e.tPeak = e.v0 / BOMB_G; }
        return 1;
      }
      type = 'storm'; forceSide = -1;                                  // no room below: a storm above instead
    }
    var radius = type === 'storm' ? 50 : type === 'balloon' ? 54 : 30; // the balloon's radius includes its bobbing
    sep = radius + 22 + margin;
    var roomUp = laneY - sep >= top - 10, roomDown = laneY + sep <= bot + 10;
    side = forceSide || (roomUp && roomDown ? (Math.random() < 0.5 ? -1 : 1) : roomUp ? -1 : 1);
    if ((side < 0 && !roomUp) || (side > 0 && !roomDown)) return 0;
    y = clamp(laneY + side * (sep + Math.random() * 50), top - 10, bot + 10);
    e = addEnt(type, x, y);
    if (type === 'balloon') e.baseY = y;
    return side;
  }

  /* ================= Flight: update ================= */

  function perk(id) { return run.perks[id] || 0; }

  function updateFly(dt) {
    var r = run;
    r.time += dt;
    if (r.safe > 0) r.safe -= dt;
    var powered = r.fuel > 0;
    var climbing = holding && powered;

    var glide = glideAt(state.up.wings) * (perk('wings') ? 0.55 : 1);
    r.vy += (climbing ? -LIFT * climbAt(state.up.wings) * PLANES[r.plane].climb : GRAVITY * (powered ? 1 : glide)) * dt;
    r.vy = clamp(r.vy, VY_UP, VY_DOWN);
    r.y += r.vy * dt;
    if (r.y < TOP) { r.y = TOP; if (r.vy < 0) r.vy = 0; }

    if (powered) {
      var burn = (climbing ? HOLD_BURN * climbBurnAt(state.up.engine) : DIVE_BURN * Math.pow(0.5, perk('slip'))) * Math.pow(0.8, perk('saver')) *
                 (1 + 0.25 * perk('overdrive')) * burnAt(state.up.eff);
      if (r.boost > 0) { r.boost -= dt; burn = 0; }                     // launch boost flies for free
      r.fuel -= dt * burn;
      if (r.fuel <= 0) {
        if (perk('wind') > 0) {
          r.perks.wind--; r.fuel = r.fuelMax * 0.4;
          SFX.fuel(); burst(PLANE_X, r.y, '#45d48a', 18); floatText('Second wind!', PLANE_X + 20, r.y - 30, '#45d48a'); drawChips();
        } else { r.fuel = 0; SFX.empty(); floatText('Out of fuel!', PLANE_X + 20, r.y - 30, '#ff5a4f'); }
      }
      r.speedMul = 1;
    } else {
      r.speedMul = Math.max(0.5, r.speedMul - 0.22 * dt);    // engine off: slow down and glide
    }
    var dive = clamp(r.vy / VY_DOWN, 0, 1) * diveBonusAt(state.up.dive);
    r.speed = Math.min(SPEED_CEILING, speedAt(state.up.engine) * PLANES[r.plane].speed * (1 + 0.2 * perk('turbo') + 0.4 * perk('overdrive')) * (1 + dive) * (r.boost > 0 ? 1.6 : 1)) * r.speedMul;
    var dx = r.speed * dt * PX_PER_M;
    r.dist += r.speed * dt;
    scrollParticles(dx);
    spawnAhead();
    if (perk('trail') && powered) {                                    // coin trail: drop coins on the plane's own path
      r.trailT -= dt;
      if (r.trailT <= 0) { r.trailT = 0.5 / perk('trail'); addEnt('coin', r.dist * PX_PER_M + 240, clamp(r.y, TOP + 30, SEA_Y - 70)); }
    }

    // exhaust trail
    if (Math.random() < dt * 40) {
      var col = !powered ? 'rgba(40,40,50,.55)' : (perk('turbo') || perk('overdrive') || r.boost > 0 || tierOf(state.up.engine) === 2) ? 'rgba(255,170,60,.8)' : 'rgba(255,255,255,.6)';
      addPart(PLANE_X - 26, r.y + 2, -30 - Math.random() * 40, (Math.random() - 0.5) * 30, 0.45, 5 + Math.random() * 4, col, 0);
    }

    var camX = r.dist * PX_PER_M, pull = magnetAt(state.up.magnet) + 90 * perk('magnet');
    updateGun(dt, camX, powered);
    for (var i = 0; i < r.ents.length; i++) {
      var e = r.ents[i], type = e.type;
      if (e.dead) continue;
      if (type === 'bird') e.x -= 70 * dt;
      else if (type === 'balloon') e.y = e.baseY + Math.sin(T * 1.5 + e.ph) * 14;
      var sx = e.x - camX + PLANE_X;
      if (sx + (e.w || 0) < -120) { e.dead = true; continue; }
      if (sx > W + 200) continue;
      if (type === 'bomb') {                                           // launches so that it peaks as the plane arrives
        if (!e.launched && sx - PLANE_X < r.speed * PX_PER_M * e.tPeak) e.launched = true;
        if (e.launched) {
          e.t += dt; e.y = SEA_Y + 20 - (e.v0 * e.t - 0.5 * BOMB_G * e.t * e.t);
          if (Math.random() < dt * 40) addPart(sx, e.y, (Math.random() - 0.5) * 40, 40, 0.4, 4 + Math.random() * 3, 'rgba(255,150,50,.8)', 0);
          if (e.t > e.tPeak && e.y > SEA_Y + 20) { e.dead = true; continue; }
        }
      }
      var ddx = PLANE_X - sx, ddy = r.y - e.y, d = Math.sqrt(ddx * ddx + ddy * ddy), canHit = r.safe <= 0;
      if (type === 'coin') {
        if (d < pull && d > 1) { e.x += ddx / d * 620 * dt; e.y += ddy / d * 620 * dt; }
        if (d < 28) { e.dead = true; gainCoin(sx, e.y); }
      } else if (type === 'fuel') {
        if (d < 40) { e.dead = true; r.fuel = Math.min(r.fuelMax, r.fuel + r.fuelMax * canShareAt(state.up.cans));
                      SFX.fuel(); burst(sx, e.y, '#45d48a', 12); floatText('Fuel +', sx, e.y - 20, '#45d48a'); }
      } else if (type === 'crate') {
        if (d < 44) { e.dead = true; SFX.orb(); burst(sx, e.y, '#c9b6ff', 16); openPick(); }
      } else if (type === 'storm') {
        if (d < 50 && canHit) {
          e.dead = true;
          if (perk('rider')) {                                         // storm rider: storms pay out
            var pay = 5 * (coinValueAt(state.up.value) + perk('gold') + 2 * perk('greedy'));
            r.coins += pay; el.runCoins.textContent = fmt(r.coins);
            SFX.bonus(); burst(sx, e.y, '#8fd3ff', 22); floatText('Storm +' + pay, sx, e.y - 20, '#8fd3ff');
          } else hit(HIT_SHARE.storm, sx, e.y);
        }
      } else if (type === 'bird' || type === 'balloon' || type === 'bomb') {
        if (canHit && d < (type === 'balloon' ? 40 : type === 'bomb' ? 34 : 30)) { e.dead = true; hit(HIT_SHARE[type], sx, e.y); }
      } else if (type === 'tower' || type === 'berg') {                // solid: stays in place and bounces the plane up and over
        var topHere = type === 'berg' ? e.y + Math.abs(ddx) * 1.2 : e.y;
        if (canHit && Math.abs(ddx) < (type === 'tower' ? 40 : 52) && r.y > topHere - 6) hit(HIT_SHARE[type], PLANE_X + 12, r.y, -340);
      } else if (type === 'gate') {                                    // solid above and below the gap
        if (canHit && Math.abs(ddx) < 42 && (r.y < e.y - e.gap / 2 + 8 || r.y > e.y + e.gap / 2 - 8)) {
          hit(HIT_SHARE.gate, PLANE_X + 12, r.y, 0);
          r.y = clamp(r.y, e.y - e.gap / 2 + 26, e.y + e.gap / 2 - 26);
        }
      } else if (type === 'wind') {
        if (powered && PLANE_X > sx && PLANE_X < sx + e.w) r.vy += e.dir * WIND_PUSH * dt;
      } else if (type === 'zap') {                                     // lightning aims at the height the plane has right now
        if (sx < W - 10) { e.dead = true; r.zaps.push({ y: clamp(r.y, TOP + 10, SEA_Y - 40), t: 0, struck: false }); SFX.zapWarn(); }
      }
    }
    r.ents = r.ents.filter(function (e) { return !e.dead; });

    for (var z = 0; z < r.zaps.length; z++) {
      var zp = r.zaps[z];
      zp.t += dt;
      if (zp.t >= ZAP_WARN && !zp.struck) {
        zp.struck = true; SFX.zap(); flash = Math.max(flash, 0.12);
        if (Math.abs(r.y - zp.y) < 32 && r.safe <= 0) hit(HIT_SHARE.zap, PLANE_X, r.y, 0);
      }
    }
    r.zaps = r.zaps.filter(function (zz) { return zz.t < ZAP_WARN + 0.28; });
    while (r.path.length > 2 && r.path[1].x < camX - 100) r.path.shift();

    if (r.dist >= r.legM) { beginLanding(); return; }
    if (r.y > SEA_Y - 10) {
      if (r.bounces > 0) seaBounce(); else { splash(); return; }
    }
    updateHud();
  }

  /* Hawk: fires by itself at the nearest soft target ahead, aiming where it will be when the shot arrives. */
  function updateGun(dt, camX, powered) {
    var r = run, i, e;
    if (r.plane !== 'hawk') return;
    if (r.muzzle > 0) r.muzzle -= dt;
    if (r.ammo < r.clip) { r.reloadT += dt; if (r.reloadT >= r.reloadAt) { r.reloadT = 0; r.ammo++; drawChips(); } }
    r.fireCd -= dt;
    if (powered && r.ammo > 0 && r.fireCd <= 0) {
      var best = null, bestDx = 1e9, range = W - PLANE_X - 30;
      for (i = 0; i < r.ents.length; i++) {
        e = r.ents[i];
        if (e.dead || e.targeted || !SOFT_TARGETS[e.type] || (e.type === 'bomb' && !e.launched)) continue;
        var dx = e.x - camX;
        if (dx < 70 || dx > (r.dark ? 230 : range) || Math.abs(e.y - r.y) > 130) continue;
        if (dx < bestDx) { best = e; bestDx = dx; }
      }
      if (best) {
        var bvx = r.speed * PX_PER_M + BULLET_SPEED, t = bestDx / (bvx - (best.type === 'bird' ? -70 : 0)), ty = best.y;
        if (best.type === 'bomb') { var tt = best.t + t; ty = SEA_Y + 20 - (best.v0 * tt - 0.5 * BOMB_G * tt * tt); }
        else if (best.type === 'balloon') ty = best.baseY + Math.sin((T + t) * 1.5 + best.ph) * 14;
        r.bullets.push({ x: camX + 28, y: r.y + 9, vx: bvx, vy: (ty - r.y - 9) / t, life: 0 });
        best.targeted = true; r.ammo--; r.fireCd = 0.22; r.muzzle = 0.07;
        SFX.shot(); drawChips();
      }
    }
    for (var b = 0; b < r.bullets.length; b++) {
      var bl = r.bullets[b];
      bl.life += dt; bl.x += bl.vx * dt; bl.y += bl.vy * dt;
      for (i = 0; i < r.ents.length; i++) {
        e = r.ents[i];
        if (!e.dead && SOFT_TARGETS[e.type] && Math.abs(bl.x - e.x) < 32 && Math.abs(bl.y - e.y) < 32) { shootDown(e, camX); bl.dead = true; break; }
      }
    }
    r.bullets = r.bullets.filter(function (bb) { return !bb.dead && bb.life < 0.7; });
  }

  function shootDown(e, camX) {
    var sx = e.x - camX + PLANE_X, n = SOFT_TARGETS[e.type];
    e.dead = true; run.kills++;
    SFX.pop(); burst(sx, e.y, e.type === 'bird' ? '#fff8ea' : '#ff8a2a', 18);
    floatText(e.type === 'bird' ? 'Bird down!' : e.type === 'balloon' ? 'Pop!' : 'Boom!', sx, e.y - 26, '#ffe58a');
    for (var k = 0; k < n; k++) addEnt('coin', e.x + 30 + k * 28, clamp(e.y + (k % 2 ? -14 : 14), TOP + 20, SEA_Y - 60));
  }

  /* Seaplane: touching the sea bounces back up and refills some fuel, while bounces last. */
  function seaBounce() {
    var r = run;
    r.bounces--; r.y = SEA_Y - 12; r.vy = VY_UP; r.safe = Math.max(r.safe, 0.4);
    r.fuel = Math.min(r.fuelMax, r.fuel + r.fuelMax * r.bounceFuel);
    r.speedMul = Math.max(r.speedMul, 0.85);
    shake = 6; SFX.bounce();
    for (var i = 0; i < 22; i++) addPart(PLANE_X + (Math.random() - 0.5) * 40, SEA_Y, (Math.random() - 0.5) * 220, -120 - Math.random() * 260, 0.7, 3 + Math.random() * 4, 'rgba(255,255,255,.9)', 900);
    floatText(r.bounces ? 'Bounce! ' + r.bounces + ' left' : 'Last bounce!', PLANE_X + 30, r.y - 40, '#bfeaff');
    drawChips();
  }

  function gainCoin(x, y) {
    var v = coinValueAt(state.up.value) + perk('gold') + 2 * perk('greedy');
    run.coins += v;
    SFX.coin();
    el.runCoins.textContent = fmt(run.coins);
    burst(x, y, '#ffc530', 6);
    floatText('+' + v, x, y - 14, '#ffe58a');
  }

  function hit(share, x, y, bounceVy) {
    run.hits++;
    if (run.shield > 0) {
      run.shield--; run.perks.shield = run.shield; run.safe = 0.6;
      SFX.block(); burst(x, y, '#5cc8ff', 18); floatText('Blocked!', PLANE_X, run.y - 34, '#5cc8ff'); drawChips();
      return;
    }
    share *= hitFactorAt(state.up.hull) * (1 + 0.5 * perk('greedy'));
    run.fuel = Math.max(0, run.fuel - run.fuelMax * share);
    run.vy = bounceVy === undefined ? 220 : bounceVy; run.safe = 0.8;
    shake = 14; flash = 0.25; SFX.hit();
    burst(x, y, '#ffe14a', 20);
    floatText('Fuel −' + Math.round(share * 100) + '%', PLANE_X, run.y - 34, '#ff5a4f');
  }

  function splash() {
    mode = 'crashing'; run.crashT = 0; holding = false;
    shake = 18; SFX.splash();
    for (var i = 0; i < 46; i++) {
      addPart(PLANE_X + (Math.random() - 0.5) * 30, SEA_Y, (Math.random() - 0.5) * 320, -160 - Math.random() * 380, 0.9 + Math.random() * 0.5,
              3 + Math.random() * 5, 'rgba(255,255,255,.9)', 900);
    }
    burst(PLANE_X, SEA_Y - 8, skin(), 14);
  }

  function beginLanding() {
    mode = 'landing'; holding = false;
    run.landT = 0; run.landFromX = run.dist * PX_PER_M; run.landFromY = run.y;
    run.ents = run.ents.filter(function (e) { return e.type === 'coin'; });
    run.zaps = []; run.bullets = [];
  }
  function islandWorldX() { return run.legM * PX_PER_M + 240; }

  function updateLanding(dt) {
    var r = run;
    r.landT = Math.min(1, r.landT + dt / 1.5);
    var t = r.landT, ease = 1 - Math.pow(1 - t, 3);
    var newX = r.landFromX + (islandWorldX() - r.landFromX) * ease;
    scrollParticles(newX - r.dist * PX_PER_M);
    r.dist = newX / PX_PER_M;
    r.y = r.landFromY + (SEA_Y - 54 - r.landFromY) * (t * t * (3 - 2 * t));
    r.vy = 0;
    if (t >= 1) finishLanding();
  }

  function finishLanding() {
    mode = 'landed';
    SFX.win();
    var bonus = landingBonus(state.island), cols = ['#ffc530', '#ff5a4f', '#45d48a', '#5cc8ff', '#ff6fa8', '#fff8ea'];
    for (var i = 0; i < 90; i++) {
      addPart(W * Math.random(), -10 - Math.random() * 80, (Math.random() - 0.5) * 120, 80 + Math.random() * 160, 2.2 + Math.random(),
              4 + Math.random() * 4, cols[i % cols.length], 160);
    }
    var reached = state.island + 1;
    var base = Math.floor(run.coins) + flightPay(run.legM) + bonus, total = withPlaneBonus(base);
    var newPlanes = Object.keys(PLANES).filter(function (id) { return !isOwned(id) && PLANES[id].freeAt <= reached; });
    state.island = reached; state.best = 0;
    save();
    var th = theme();
    el.hud.hidden = true;
    showResult('Island ' + (reached + 1) + ' reached!', 'good',
      'New sky unlocked: ' + th.name + '. Your plane has a new colour, and the next hop is ' + legMetres(reached) + ' m.' +
      newPlanes.map(function (id) { return ' New plane in the garage: ' + PLANES[id].name + '!'; }).join('') + flightNote(base, total),
      total, [[fmt(run.coins), 'Coins'], [flightPay(run.legM), 'Distance'], [bonus, 'Landing bonus']], '');
  }

  function updateCrash(dt) {
    run.crashT += dt;
    if (run.crashT > 0.9) showCrashResult();
  }

  function showCrashResult() {
    mode = 'over';
    var r = run, flown = Math.floor(r.dist), shortBy = Math.max(1, Math.ceil(r.legM - r.dist));
    var close = shortBy <= r.legM * 0.25;
    var base = Math.floor(r.coins) + flightPay(flown), total = withPlaneBonus(base);
    state.best = Math.max(state.best, flown);
    save();
    el.hud.hidden = true;
    showResult(close ? 'So close!' : 'Splashdown', close ? 'warn' : 'bad',
      'You flew ' + flown + ' m. The island was ' + (close ? 'only ' : '') + shortBy + ' m away.' + flightNote(base, total),
      total, [[fmt(r.coins), 'Coins'], [flightPay(flown), 'Distance'], [flown + ' m', 'Flown']],
      r.revived ? '' : '<button class="btn ad" data-act="revive">' + AD_ICON + 'Watch ad · refuel</button>');
  }

  function withPlaneBonus(base) { return run.plane === 'skylark' ? Math.round(base * (1 + flightBonusAt(state.special.skylark) / 100)) : base; }
  /* One extra line on the result card about the plane: its bonus, its kills, or the end of a trial. */
  function flightNote(base, total) {
    var t = '';
    if (total > base) t += ' Skylark bonus: +' + fmt(total - base) + '.';
    if (run.kills) t += ' Shot down: ' + run.kills + '.';
    if (run.trial) t += ' Trial over: the ' + PLANES[run.plane].name + ' is waiting in the garage.';
    return t;
  }

  var AD_ICON = '<svg class="adi" viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>';

  function collectButtons(total) {
    return (total > 0 ? '<button class="btn ad" data-act="collect-ad" data-id="' + total + '">' + AD_ICON + 'Watch ad · collect ' + fmt(total * 2) + '</button>' : '') +
           '<button class="btn gold" data-act="collect" data-id="' + total + '">Collect ' + fmt(total) + '</button>';
  }

  /* End-of-flight card: ribbon title, coin total that counts up, three stat cells, then the buttons. */
  function showResult(title, tone, text, total, cells, extraButtons) {
    var html = '<div class="card pop"><div class="ribbon ' + tone + '">' + title + '</div><p>' + text + '</p>' +
               '<div class="big num"><i class="coin"></i><span data-count="' + total + '">' + fmt(total) + '</span></div><div class="sum">';
    cells.forEach(function (c) { html += '<div><b class="num">' + c[0] + '</b><span>' + c[1] + '</span></div>'; });
    el.overlay.innerHTML = html + '</div>' + extraButtons + collectButtons(total) + '</div>';
    countUp();
  }
  function countUp() {
    var node = el.overlay.querySelector && el.overlay.querySelector('[data-count]');
    if (!node) return;
    var target = Number(node.dataset.count), t0 = performance.now();
    function tickCount(now) {
      var k = clamp((now - t0) / 600, 0, 1);
      node.textContent = fmt(target * (1 - Math.pow(1 - k, 3)));
      if (k < 1 && node.isConnected) requestAnimationFrame(tickCount);
    }
    requestAnimationFrame(tickCount);
  }

  function revive() {
    var r = run;
    SFX.fuel();
    r.zaps = [];
    r.revived = true; r.fuel = r.fuelMax * 0.6; r.y = H * 0.36; r.vy = -140; r.speedMul = 1; r.safe = 1.5;
    var camX = r.dist * PX_PER_M;
    r.ents = r.ents.filter(function (e) { return e.type === 'coin' || e.type === 'fuel' || e.x - camX > 420; });
    el.overlay.innerHTML = ''; el.hud.hidden = false;
    holding = false; mode = 'fly';
    floatText('Refuelled!', PLANE_X + 10, r.y - 30, '#45d48a');
  }

  /* ================= Mid-flight pick ================= */

  function openPick(rerolled) {
    mode = 'pick'; holding = false;
    var ids = pickThree(Math.random, run.perks);
    var html = '<div class="card pop"><div class="ribbon">Pick a power-up</div><div class="perks">';
    ids.forEach(function (id) {
      var p = PERKS[id], lvl = perk(id);
      html += '<button class="perk ' + p.rarity + '" data-act="perk" data-id="' + id + '" style="--pc:' + p.colour + '"><span class="g">' + p.glyph +
              '</span><span><em class="rar">' + RARITY[p.rarity].label + '</em><b>' + p.name + (lvl ? '<small>Lv ' + (lvl + 1) + '</small>' : '') +
              '</b><span>' + p.text + '</span></span></button>';
    });
    html += '</div>' + (rerolled ? '' : '<button class="btn ad" data-act="reroll">' + AD_ICON + 'Watch ad · 3 new picks</button>') + '</div>';
    el.overlay.innerHTML = html;
  }

  function choosePerk(id) {
    if (!PERKS[id] || mode !== 'pick') return;
    if (id === 'jackpot') { run.coins += 20 * coinValueAt(state.up.value); el.runCoins.textContent = fmt(run.coins); }
    else if (id === 'refuel') run.fuel = Math.min(run.fuelMax, run.fuel + run.fuelMax * 0.6);
    else if (id === 'shield') { run.shield++; run.perks.shield = run.shield; }
    else run.perks[id] = perk(id) + 1;
    if (id === 'clear') run.ents = run.ents.filter(function (e) { return e.type !== 'bird'; });
    el.overlay.innerHTML = '';
    SFX.perk();
    run.safe = Math.max(run.safe, 0.5);
    mode = 'fly';
    floatText(PERKS[id].name + '!', PLANE_X + 20, run.y - 36, PERKS[id].colour);
    drawChips();
  }

  function drawChips() {
    var html = run.plane === 'hawk' ? '<span class="chip" style="color:#ffe14a">AMMO ' + run.ammo + '/' + run.clip + '</span>'
             : run.plane === 'seaplane' ? '<span class="chip" style="color:#bfeaff">BOUNCE ' + run.bounces + '</span>' : '';
    Object.keys(run.perks).forEach(function (id) {

  /* ================= Hangar ================= */

  function upgradeEffect(key) {
    var l = state.up[key];

      : 'Top speed reached. Climbing burns ' + Math.round(climbBurnAt(l) * 100) + '% → ' + Math.round(climbBurnAt(l + 1) * 100) + '% fuel';
    if (key === 'tank')   return tankAt(l) + ' → ' + tankAt(l + 1) + ' s of fuel';
    if (key === 'magnet') return 'Pull range ' + magnetAt(l) + ' → ' + magnetAt(l + 1);
    if (key === 'wings')  return 'Glide ' + glidePct(l) + '% → ' + glidePct(l + 1) + '%, stronger climb';
    if (key === 'hull')   return 'Hits cost ' + Math.round(hitFactorAt(l) * 100) + '% → ' + Math.round(hitFactorAt(l + 1) * 100) + '% fuel' +
                                 (!hasFreeHit(l) && hasFreeHit(l + 1) ? ', first hit free' : '');
    if (key === 'launch') return 'Free boost at take-off: ' + launchAt(l).toFixed(1) + ' → ' + launchAt(l + 1).toFixed(1) + ' s';
    if (key === 'eff')    return 'Fuel use ' + Math.round(burnAt(l) * 100) + '% → ' + Math.round(burnAt(l + 1) * 100) + '%';
    if (key === 'dive')   return 'Dive speed +' + Math.round(diveBonusAt(l) * 100) + '% → +' + Math.round(diveBonusAt(l + 1) * 100) + '%';
    if (key === 'cans')   return 'A can refills ' + Math.round(canShareAt(l) * 100) + '% → ' + Math.round(canShareAt(l + 1) * 100) + '% of the tank';
    if (key === 'crates') return 'Power-ups every ' + Math.round(230 * crateSpacingAt(l)) + ' → ' + Math.round(230 * crateSpacingAt(l + 1)) + ' m';

  function goHangar() {
    mode = 'hangar'; run = null; holding = false;

  /* Stand-in for a rewarded video ad. A real build would call the ad network here. */
  function playAd(onReward) {
    var left = AD_SECONDS, before = el.overlay.innerHTML;
    function draw() {
      el.overlay.innerHTML = '<div class="card"><div class="ribbon">Ad placeholder</div><div class="adbox"><b class="num">' + left +
        '</b><p>A rewarded video ad would play here.</p></div><p>Your reward arrives when the timer ends.</p></div>';
    }
    draw();
    var id = setInterval(function () {
      left--;
      if (left > 0) { draw(); return; }
      clearInterval(id);
      state.ads++;
      SFX.bonus();
      el.overlay.innerHTML = before;
      onReward();
    }, 1000);
  }

  /* ================= Input ================= */

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.dataset.act, id = b.dataset.id;
    if (act !== 'reset') resetArmed = false;
    audioOn();
    SFX.tap();
    if (act === 'mute') { state.mute = state.mute ? 0 : 1; save(); audioOn(); SFX.tap(); renderHangar(); }
    else if (act === 'preview') { previewId = id; renderHangar(); }
    else if (act === 'select') { if (isOwned(id)) { state.plane = id; previewId = null; SFX.buy(); save(); renderHangar(); } }
    else if (act === 'buyplane') {
      if (!isOwned(id) && state.coins >= PLANES[id].cost) { state.coins -= PLANES[id].cost; state.owned[id] = 1; state.plane = id; previewId = null; SFX.buy(); save(); renderHangar(); }
    }
    else if (act === 'try') { if (!isOwned(id)) playAd(function () { trialPlane = id; takeOff(); SFX.takeoff(); }); }
    else if (act === 'special' || act === 'special-ad') {
      if (!isOwned(id) || state.special[id] >= SPECIAL_MAX - 1) return;
      var sc = specialCost(state.special[id]), so = offerFor(state.coins, sc);
      if (act === 'special' && so === 'buy') { state.coins -= sc; state.special[id]++; SFX.buy(); save(); renderHangar(); }
      else if (act === 'special-ad' && so === 'ad') playAd(function () { state.coins = 0; state.special[id]++; save(); renderHangar(); });
    }
    else if (act === 'tab') { hangarTab = ['garage', 'part', 'tune'].indexOf(id) >= 0 ? id : 'part'; previewId = null; renderHangar(); var sc = el.sheet.querySelector('.scroll'); if (sc) sc.scrollTop = 0; }
    else if (act === 'fly') { takeOff(); SFX.takeoff(); }
    else if (act === 'perk') choosePerk(id);
    else if (act === 'reroll') playAd(function () { openPick(true); });
    else if (act === 'revive') playAd(revive);
    else if (act === 'collect') { state.coins += Number(id); SFX.buy(); goHangar(); }
    else if (act === 'collect-ad') playAd(function () { state.coins += Number(id) * 2; goHangar(); });
    else if (act === 'upgrade' || act === 'upgrade-ad') {
      var cost = upgradeCost(id, state.up[id]), offer = offerFor(state.coins, cost);
      if (state.up[id] >= UPGRADES[id].max) return;
      if (act === 'upgrade' && offer === 'buy') { state.coins -= cost; state.up[id]++; SFX.buy(); save(); renderHangar(); }
      else if (act === 'upgrade-ad' && offer === 'ad') playAd(function () { state.coins = 0; state.up[id]++; save(); renderHangar(); });
    }
    else if (act === 'reset') {
      if (resetArmed) { state = defaultState(); resetArmed = false; save(); } else resetArmed = true;
      renderHangar();
    }
  });

  el.game.addEventListener('pointerdown', function (e) {

  /* ================= Particles ================= */

  function addPart(x, y, vx, vy, life, size, colour, grav) {
    if (parts.length < 400) parts.push({ x: x, y: y, vx: vx, vy: vy, life: life, max: life, size: size, colour: colour, grav: grav });
  }
  function burst(x, y, colour, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.28, s = 60 + Math.random() * 200;
      addPart(x, y, Math.cos(a) * s, Math.sin(a) * s, 0.35 + Math.random() * 0.3, 2 + Math.random() * 4, colour, 300);
    }
  }
  function floatText(text, x, y, colour) { floaters.push({ text: text, x: x, y: y, life: 0.9, colour: colour }); }
  function scrollParticles(dx) {
    for (var i = 0; i < parts.length; i++) parts[i].x -= dx * 0.9;
    for (var j = 0; j < floaters.length; j++) floaters[j].x -= dx * 0.5;
  }
  function updateParticles(dt) {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.life -= dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    }
    parts = parts.filter(function (p) { return p.life > 0; });
    for (var j = 0; j < floaters.length; j++) { floaters[j].life -= dt; floaters[j].y -= 46 * dt; }
    floaters = floaters.filter(function (f) { return f.life > 0; });
  }

  /* ================= Drawing ================= */

  var farClouds = [], nearClouds = [], stars = [], lines = [], i;
  for (i = 0; i < 7; i++) farClouds.push({ x: Math.random() * 1400, f: 0.08 + Math.random() * 0.4, s: 0.5 + Math.random() * 0.4 });
  for (i = 0; i < 5; i++) nearClouds.push({ x: Math.random() * 1400, f: 0.1 + Math.random() * 0.6, s: 0.9 + Math.random() * 0.6 });
  for (i = 0; i < 50; i++) stars.push({ x: Math.random(), y: Math.random() * 0.7, r: 0.6 + Math.random() * 1.2, ph: Math.random() * 6.28 });
  for (i = 0; i < 14; i++) lines.push({ x: Math.random(), y: Math.random(), l: 30 + Math.random() * 60 });

  function wrap(x, span) { return ((x % span) + span) % span; }

  function cloud(x, y, s, colour) {
    ctx.fillStyle = colour;
    ctx.beginPath();
    ctx.arc(x, y, 26 * s, 0, 6.28); ctx.arc(x + 30 * s, y - 12 * s, 32 * s, 0, 6.28);
    ctx.arc(x + 66 * s, y, 26 * s, 0, 6.28); ctx.arc(x + 34 * s, y + 8 * s, 30 * s, 0, 6.28);

  }

  var ISLAND_LOOK = {
    sand: { ground: '#f2d589', rock: '', palms: true },
    rock: { ground: '#8f8779', rock: '#6d665b', palms: false },
    lava: { ground: '#3a2226', rock: '#ff7a2a', palms: false },
    ice:  { ground: '#eaf8ff', rock: '#bfe6f5', palms: false },
    city: { ground: '#6b6f86', rock: '#ffd84a', palms: false }
  };
  function drawIsland(x, isDest) {
    if (x < -260 || x > W + 260) return;
    var look = ISLAND_LOOK[theme().island];
    ctx.fillStyle = look.ground;
    ctx.beginPath(); ctx.ellipse(x, SEA_Y + 8, 170, 50, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#5a6373'; ctx.fillRect(x - 90, SEA_Y - 40, 180, 6);          // runway
    ctx.fillStyle = '#fff8ea';
    for (var k = -3; k <= 3; k++) ctx.fillRect(x + k * 26 - 6, SEA_Y - 38, 12, 2);
    if (look.palms) { palm(x - 120, SEA_Y - 28, 1); palm(x + 126, SEA_Y - 26, 0.8); }
    else {
      ctx.fillStyle = look.rock;
      ctx.beginPath(); ctx.ellipse(x - 122, SEA_Y - 34, 20, 14, 0, 0, 6.28); ctx.ellipse(x + 130, SEA_Y - 30, 14, 10, 0, 0, 6.28); ctx.fill();
    }
    if (isDest) {
      ctx.strokeStyle = '#fff8ea'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x + 96, SEA_Y - 40); ctx.lineTo(x + 96, SEA_Y - 96); ctx.stroke();
      ctx.fillStyle = '#ffc530';
      ctx.beginPath(); ctx.moveTo(x + 97, SEA_Y - 96); ctx.lineTo(x + 126 + Math.sin(T * 6) * 3, SEA_Y - 87); ctx.lineTo(x + 97, SEA_Y - 78); ctx.fill();
    }
  }

  /* Background set piece that makes each environment look different. Drawn behind the near clouds. */
  function drawScenery(scene, camX) {
    var i, x, j;
    if (scene === 'boats') {

      ctx.fillStyle = '#ffffff';
      for (var s = 0; s < stars.length; s++) {
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(T * 2 + stars[s].ph);
        ctx.beginPath(); ctx.arc(stars[s].x * W, stars[s].y * SEA_Y, stars[s].r, 0, 6.28); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = th.sun; ctx.globalAlpha = 0.25;                               // sun or moon with a soft glow
    ctx.beginPath(); ctx.arc(W * 0.78, H * 0.2, 58, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(W * 0.78, H * 0.2, 36, 0, 6.28); ctx.fill();

    var c, x;
    for (c = 0; c < farClouds.length; c++) {
      x = wrap(farClouds[c].x - camX * 0.12, 1400) - 200;
      cloud(x, TOP + farClouds[c].f * (SEA_Y - TOP), farClouds[c].s, 'rgba(255,255,255,.35)');
    }
    ctx.fillStyle = th.far;                                                       // distant islands on the horizon
    for (c = 0; c < 3; c++) {
      x = wrap(c * 520 + 200 - camX * 0.2, 1500) - 240;
      ctx.beginPath(); ctx.ellipse(x, SEA_Y + 4, 110 + c * 20, 26 + c * 8, 0, 0, 6.28); ctx.fill();
    }
    if (run) {
      drawIsland(-140 - camX + PLANE_X, false);
      drawIsland(islandWorldX() - camX + PLANE_X, true);
    }
    drawScenery(th.scene, camX);
    for (c = 0; c < nearClouds.length; c++) {
      x = wrap(nearClouds[c].x - camX * 0.45, 1400) - 200;
      cloud(x, TOP + nearClouds[c].f * (SEA_Y - TOP - 60), nearClouds[c].s, 'rgba(255,255,255,.75)');
    }

    ctx.fillStyle = th.sea; ctx.fillRect(-20, SEA_Y, W + 40, H - SEA_Y + 20);     // sea with rolling wave bands
    for (var k = 0; k < 3; k++) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.1 - k * 0.02) + ')';
      ctx.beginPath(); ctx.moveTo(-20, H + 20);
      for (x = -20; x <= W + 20; x += 14) {
        ctx.lineTo(x, SEA_Y + k * 16 + Math.sin((x + camX * (0.7 + k * 0.3)) / (36 + k * 12) + T * (1.2 + k * 0.5)) * 4);
      }
      ctx.lineTo(W + 20, H + 20); ctx.fill();
    }

    if (run) {
      for (var n = 0; n < run.ents.length; n++) {
        var e = run.ents[n], sx = e.x - camX + PLANE_X;
        if (sx > -100 - (e.w || 0) && sx < W + 100) {
          if (run.dark && HIT_SHARE[e.type]) ctx.globalAlpha = clamp(1 - (sx - PLANE_X - 130) / 100, 0.18, 1);   // darkness: obstacles show up late
          drawEnt(e, sx);
          ctx.globalAlpha = 1;
        }
      }
      drawZaps();
      for (var bi = 0; bi < run.bullets.length; bi++) {                       // tracer rounds
        var bl = run.bullets[bi], bx = bl.x - camX + PLANE_X, k = 18 / Math.sqrt(BULLET_SPEED * BULLET_SPEED + bl.vy * bl.vy);
        ctx.lineCap = 'round';
        ctx.strokeStyle = LINE; ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(bx - BULLET_SPEED * k, bl.y - bl.vy * k); ctx.lineTo(bx, bl.y); ctx.stroke();
        ctx.strokeStyle = '#ffe14a'; ctx.lineWidth = 4; ctx.stroke();
      }
    }

    // speed lines: stronger the faster you go
    var fast = run && mode === 'fly' ? clamp((run.speed / speedAt(state.up.engine) - 0.95) * 2.2, 0, 1) : 0;
    if (fast > 0.02) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * fast) + ')'; ctx.lineWidth = 2;
      for (var l = 0; l < lines.length; l++) {
        var lx = wrap(lines[l].x * (W + 200) - camX * 2.4, W + 200) - 100, ly = TOP + lines[l].y * (SEA_Y - TOP - 20);
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + lines[l].l * (0.6 + fast), ly); ctx.stroke();
      }
    }

    // plane
    if (mode === 'hangar') drawPlane(W * 0.56, H * 0.235 + Math.sin(T * 2) * 8, Math.cos(T * 2) * 60, true, 1.9);   // bigger, to show off the parts
    else if (run && mode !== 'crashing' && mode !== 'over') {
      if (!(run.safe > 0 && mode === 'fly' && Math.floor(T * 14) % 2)) drawPlane(PLANE_X, run.y, run.vy, run.fuel > 0);
      if (run.shield > 0) {
        ctx.strokeStyle = 'rgba(92,200,255,.85)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(PLANE_X, run.y, 38 + Math.sin(T * 6) * 2, 0, 6.28); ctx.stroke();
      }
    }

    if (run && run.dark) {                                                        // darkness closes in around the plane
      var dg = ctx.createRadialGradient(PLANE_X, run.y, 70, PLANE_X, run.y, 360);
      dg.addColorStop(0, 'rgba(2,4,20,0)'); dg.addColorStop(1, 'rgba(2,4,20,.6)');
      ctx.fillStyle = dg; ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    for (var p = 0; p < parts.length; p++) {
      var pt = parts[p];
      ctx.globalAlpha = clamp(pt.life / pt.max, 0, 1);
      ctx.fillStyle = pt.colour;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = '800 20px "Baloo 2", "Trebuchet MS", sans-serif'; ctx.textAlign = 'center';
    for (var f = 0; f < floaters.length; f++) {
      ctx.globalAlpha = clamp(floaters[f].life / 0.5, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillText(floaters[f].text, floaters[f].x + 1, floaters[f].y + 2);
      ctx.fillStyle = floaters[f].colour; ctx.fillText(floaters[f].text, floaters[f].x, floaters[f].y);
    }
    ctx.globalAlpha = 1;

    if (run && mode === 'fly' && state.seenHint < 2 && run.time < 5) {            // first flights only
      ctx.font = '800 22px "Baloo 2", "Trebuchet MS", sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillText('Hold to climb · release to dive', W / 2 + 1, H * 0.5 + 2);
      ctx.fillStyle = '#fff8ea'; ctx.fillText('Hold to climb · release to dive', W / 2, H * 0.5);
      ctx.font = '600 16px "Mukta", sans-serif';
      ctx.fillText('Diving is faster and saves fuel', W / 2, H * 0.5 + 26);
    }
    var intro = run && mode === 'fly' && run.time < 4 ? introFor(state.island) : null;   // names the new obstacle at take-off
    if (intro) {
      ctx.lineJoin = 'round'; ctx.strokeStyle = LINE; ctx.lineWidth = 6;
      ctx.font = '800 26px "Baloo 2", "Trebuchet MS", sans-serif';
      ctx.strokeText(intro[0], W / 2, H * 0.5); ctx.fillStyle = '#ffc530'; ctx.fillText(intro[0], W / 2, H * 0.5);
      ctx.font = '700 17px "Mukta", sans-serif'; ctx.lineWidth = 5;
      ctx.strokeText(intro[1], W / 2, H * 0.5 + 26); ctx.fillStyle = '#fff8ea'; ctx.fillText(intro[1], W / 2, H * 0.5 + 26);
    }
    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flash + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
    ctx.restore();
  }

  /* ================= Main loop ================= */

  var last = 0;
  function frame(ts) {
    var dt = Math.min(0.033, (ts - last) / 1000 || 0);
    last = ts;
    step(dt);
    render();
    requestAnimationFrame(frame);
  }
  function step(dt) {
    T += dt;
    if (shake > 0) shake = Math.max(0, shake - 40 * dt);
    if (flash > 0) flash = Math.max(0, flash - dt);
    if (mode === 'fly') {
      updateFly(dt);
      if (run && run.time > 5 && state.seenHint < 2 && !run.hinted) { run.hinted = true; state.seenHint++; }
    }
    else if (mode === 'crashing') updateCrash(dt);
    else if (mode === 'landing') { updateLanding(dt); if (run) updateHud(); }
    else if (mode === 'hangar') {
      ambientX += 60 * dt;
      if (Math.random() < dt * 30) addPart(W * 0.56 - 55, H * 0.235 + Math.sin(T * 2) * 8, -80, (Math.random() - 0.5) * 20, 0.5, 5, 'rgba(255,255,255,.55)', 0);
    }
    if (mode !== 'pick') updateParticles(dt);
  }

  function start(data) {
    state = merge((data && data.state) || load());
    resize();
    goHangar();
    requestAnimationFrame(frame);
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { state: state }; });
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

  // Exposed for automated checks; the game itself does not use this.
  window.__skyHopper = {
    rules: { legMetres: legMetres, upgradeCost: upgradeCost, offerFor: offerFor, pickThree: pickThree, distanceBonus: distanceBonus, landingBonus: landingBonus, tankAt: tankAt, speedAt: speedAt, glideAt: glideAt, hitFactorAt: hitFactorAt, tierOf: tierOf, perks: PERKS, hazardSet: hazardSet, difficultyAt: difficultyAt, climbBurnAt: climbBurnAt, planes: PLANES, clipAt: clipAt, reloadAt: reloadAt, bouncesAt: bouncesAt },
    setTrial: function (id) { trialPlane = id; },
    step: step, render: render, takeOff: takeOff, choosePerk: choosePerk, revive: revive,
    get: function () { return { state: state, run: run, mode: mode }; },
    hold: function (v) { holding = v; }
  };
})();
</script>
</body>
</html>
